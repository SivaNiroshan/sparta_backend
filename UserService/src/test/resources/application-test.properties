# Test profile: in-memory H2, disable external services where possible
spring.application.name=USERSERVICE
server.port=0

# H2 in-memory database (override PostgreSQL from main config)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# Optimize HikariCP for tests
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JPA/Hibernate for H2 - Force H2 dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Prevent Hibernate from executing database-specific initialization scripts
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# JWT (same as dev for tests)
jwt.secret=sparta-gateway-jwt-secret-key-minimum-256-bits-for-production-use-change-this
jwt.expiration=86400000
jwt.refresh.expiration=604800000

# MongoDB in-memory not available; use localhost (test will fail if Mongo not running) or exclude Mongo for this test
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=sparta_friends_test

# Redis - disabled for tests; mock RedisTemplate is used (no local Redis required)
redis.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

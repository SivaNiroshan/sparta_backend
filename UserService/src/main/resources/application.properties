spring.application.name=USERSERVICE
server.port=8081

# AWS RDS PostgreSQL Database Configuration
# See AWS_RDS_SETUP_GUIDE.md for detailed step-by-step instructions on how to get these values
# Replace these values with your actual AWS RDS PostgreSQL endpoint, database name, username, and password
spring.datasource.url=jdbc:postgresql://<your-rds-endpoint>:5432/postgres
spring.datasource.username=<name-of-the-user>
spring.datasource.password=<password-of-the-user>
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Gmail SMTP Configuration for OTP Service
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=<email-of-the-user>
spring.mail.password=<password-of-the-user>
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Redis Configuration
# Option 1: AWS ElastiCache - See AWS_ELASTICACHE_REDIS_SETUP_GUIDE.md
# Option 2: Redis Cloud (Free Tier) - See REDIS_CLOUD_SETUP_GUIDE.md (Recommended for Development)
# Option 3: Local Redis - Use localhost:6379 with ssl=false

# Current Configuration (Update with your Redis Cloud or ElastiCache details)
spring.data.redis.host=<redis-endpoint>
spring.data.redis.port=<redis-port>
spring.data.redis.password=<redis-password>
spring.data.redis.ssl.enabled=false
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Redis Cloud Example Configuration (Uncomment and update if using Redis Cloud):
# spring.data.redis.host=redis-12345.c123.us-east-1-1.ec2.cloud.redislabs.com
# spring.data.redis.port=12345
# spring.data.redis.password=your-redis-cloud-password
# spring.data.redis.ssl.enabled=true  # Use true for SSL port, false for regular port

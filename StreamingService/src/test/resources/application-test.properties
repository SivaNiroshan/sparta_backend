# Test profile for StreamingService
# Unit tests: use this config with mocks (@MockBean for S3Client/S3Service) - no real AWS/S3 calls.
# Integration tests: use @DynamicPropertySource to override S3 with Testcontainers (LocalStack).

spring.application.name=STREAMINGSERVICE
server.port=0

# CORS (same as main for consistent behavior in tests)
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,HEAD,OPTIONS
spring.web.cors.allowed-headers=*

# AWS S3 - placeholder values for unit tests (mocked; not used for real calls)
# Integration tests override these via Testcontainers LocalStack + @DynamicPropertySource
aws.s3.bucket-name=sparta-streaming-test-bucket
aws.s3.region=us-east-1
aws.s3.access-key=test-access-key
aws.s3.secret-key=test-secret-key
aws.s3.base-path=videos-test
# Optional: set by integration tests to LocalStack endpoint
# aws.s3.endpoint-override=http://localhost:4566

# Logging for tests
logging.level.root=WARN
logging.level.com.Sparta.StreamingService=DEBUG

# Actuator / management
management.endpoints.web.exposure.include=health,info
management.endpoints.enabled-by-default=false

# Test profile configuration for UploadService
spring.application.name=UPLOADSERVICE
server.port=0

# TUS Server Configuration for testing
tusserver.tusmaxsize=1073741824
tusserver.storagefolder=storage-test
upload.buffer-size=65536

# RabbitMQ configuration for testing
# Use localhost or disable for tests that don't require RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.listener.simple.allowed-list-patterns=com.Sparta.UploadService.Rabbit.*,com.Sparta.UploadService.TusServer.model.*

# MongoDB configuration for testing
# Use test database to avoid conflicts with production data
spring.data.mongodb.uri=mongodb://localhost:27017
spring.data.mongodb.database=SpartaMongo_Test

# AWS S3 Configuration for testing
# Use test bucket or mock S3 client in tests
aws.s3.bucket-name=sparta-video-storage-test
aws.s3.region=us-east-1
aws.s3.access-key=test-access-key
aws.s3.secret-key=test-secret-key
aws.s3.base-path=videos-test

# Logging configuration for tests
logging.level.root=WARN
logging.level.com.Sparta.UploadService=DEBUG
logging.level.tusserver=WARN

# Disable unnecessary features for faster test execution
spring.mvc.dispatch-options-request=true
management.endpoints.enabled-by-default=false

# Test profile configuration for GatewayService
spring.application.name=GatewayService
server.port=0

# Gateway routes for testing
# Note: These routes point to test instances or can be mocked
# For integration tests, ensure test services are running on these ports
spring.cloud.gateway.routes[0].id=userservice
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/account/**

spring.cloud.gateway.routes[1].id=uploadservice
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/upload/**

# JWT Configuration for testing
# Must match the test secret used in JwtUtilTest and other test classes
jwt.secret=test-secret-key-for-jwt-testing-min-256-bits-required-for-hmac256-algorithm

# Logging configuration for tests
logging.level.root=WARN
logging.level.com.Sparta.GatewayService=DEBUG
logging.level.org.springframework.cloud.gateway=WARN

# Disable unnecessary features for faster test execution
spring.cloud.gateway.metrics.enabled=false
management.endpoints.enabled-by-default=false
